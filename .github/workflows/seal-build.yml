name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Space-separated top-level test names to run (empty runs the full suite)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Build module zip
        run: |
          set -eux
          helper="$(mktemp -d)"
          cp .github/create_mod.go "$helper/create_mod.go"
          (cd "$helper" && go mod init example.com/createmod && go get golang.org/x/mod@v0.28.0 && go build -o create_mod create_mod.go)
          # the workflow and helper are Seal CI plumbing; upstream ships no .github
          rm -rf "$GITHUB_WORKSPACE/.github"
          mkdir -p "$RUNNER_TEMP/dist"
          "$helper/create_mod" golang.org/x/net v0.45.0 "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dist/v0.45.0.zip"
          unzip -l "$RUNNER_TEMP/dist/v0.45.0.zip" | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/dist/v0.45.0.zip
          if-no-files-found: error

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GOEXPERIMENT: synctest
      TEST_FILTER: ${{ inputs.test-filter }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        run: |
          set -eux
          go version
          go build ./...
      - name: Test
        run: |
          set -euxo pipefail
          if [ -n "$TEST_FILTER" ]; then
            go test -v -run "^($(echo "$TEST_FILTER" | tr ' ' '|'))$" ./... 2>&1 | tee "$RUNNER_TEMP/scoped.log"
            for t in $TEST_FILTER; do grep -qE "^=== RUN[[:space:]]+${t}(/|$)" "$RUNNER_TEMP/scoped.log" || { echo "selected test $t did not run"; exit 1; }; done
          else
            go test -v ./... 2>&1 | tee "$RUNNER_TEMP/full.log"
            awk '/^(ok|FAIL|\?)[[:space:]]/ {print} /^[[:space:]]*--- PASS/ {p++} /^[[:space:]]*--- FAIL/ {f++} /^[[:space:]]*--- SKIP/ {s++} END {printf "TEST SUMMARY: %d passed, %d failed, %d skipped\n", p, f, s}' "$RUNNER_TEMP/full.log"
          fi
